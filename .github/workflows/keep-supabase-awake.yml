name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -sS "https://qaocnwayovacfkdaakdd.supabase.co/rest/v1/jr_class?select=id&limit=1" \
            -H "apikey: sb_publishable_Sbf9FyryOKEw-JZcCkkMRA_MbB4tgyN"
          echo
          curl -sS -X POST "https://qaocnwayovacfkdaakdd.supabase.co/rest/v1/rpc/jr_pull" \
            -H "apikey: sb_publishable_Sbf9FyryOKEw-JZcCkkMRA_MbB4tgyN" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"JUDO","p_since":9999999999999}' | head -c 300
