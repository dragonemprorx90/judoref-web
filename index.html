<title>JudoRef</title>

<meta name="theme-color" content="#1D3F73">

<style>
/* Layout: a phone-sized app frame centred on desktop, edge-to-edge on phones. One stack, one accent. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#E2E6EE;
  --ink:#101828; --ink-2:#475467; --ink-3:#8A94A6;
  --navy:#1D3F73; --navy-deep:#122B52; --navy-soft:#E4ECF9; --on-navy:#FFFFFF;
  --good:#1E7B4D; --good-soft:#E1F3E8; --warn:#A86A12; --warn-soft:#FBEFD6; --bad:#B8392A; --bad-soft:#FAE3DF;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --font-ar:"Tajawal","Manrope",system-ui,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#141C2B; --surface-2:#1B2436; --line:#27324A;
  --ink:#EEF2F8; --ink-2:#B6C0D2; --ink-3:#7E8AA0;
  --navy:#3D6DB8; --navy-deep:#1E3A66; --navy-soft:#1E2E4A; --on-navy:#FFFFFF;
  --good:#5BC98C; --good-soft:#153826; --warn:#E0A94A; --warn-soft:#3B2C10; --bad:#F08A7C; --bad-soft:#3F1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#141C2B; --surface-2:#1B2436; --line:#27324A;
  --ink:#EEF2F8; --ink-2:#B6C0D2; --ink-3:#7E8AA0;
  --navy:#3D6DB8; --navy-deep:#1E3A66; --navy-soft:#1E2E4A; --on-navy:#FFFFFF;
  --good:#5BC98C; --good-soft:#153826; --warn:#E0A94A; --warn-soft:#3B2C10; --bad:#F08A7C; --bad-soft:#3F1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink)}

.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:14px}
.stage-note{font-size:13px;color:var(--ink-3);text-align:center;max-width:420px}
.phone{width:100%;max-width:400px;height:min(820px,calc(100vh - 100px));min-height:640px;background:var(--surface);border-radius:32px;box-shadow:var(--shadow),0 0 0 8px var(--navy-deep);overflow:hidden;position:relative;display:flex;flex-direction:column}
@media (max-width:480px){ .stage{padding:0} .stage-note{display:none} .phone{max-width:none;height:100%;min-height:100%;border-radius:0;box-shadow:none} }
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.app[dir="rtl"]{font-family:var(--font-ar)}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;min-height:56px}
.bar h1{font-size:20px;font-weight:800;margin:0;flex:1;letter-spacing:-.01em;text-wrap:balance}
.bar .icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.bar .icon-btn:hover{background:var(--surface-2)}
.bar .sub{font-size:13px;color:var(--ink-3)}
.bar .title-wrap{flex:1;min-width:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px}

/* nav */
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 8px 10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--navy)} .nav button.on svg{stroke-width:2.2}
.nav button.on span.pill{background:var(--navy-soft);border-radius:999px;padding:2px 14px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-deep) 100%);color:var(--on-navy);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero .big{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.hero .time{font-size:17px;font-weight:600;opacity:.95}
.hero .meta{font-size:13.5px;opacity:.8;margin-top:6px}
.hero .chip{position:absolute;top:16px;inset-inline-end:16px}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
h2{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
.muted{color:var(--ink-2);font-size:13.5px}
.tiny{color:var(--ink-3);font-size:12.5px}
.notice{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:flex-start}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;font-weight:800;font-size:15px;padding:0 16px;transition:transform .06s ease,background .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--navy);color:var(--on-navy)}
.btn.tonal{background:var(--navy-soft);color:var(--navy)}
.btn.ghost{background:var(--surface-2);color:var(--ink-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row-btns{display:flex;gap:8px}
.fab{position:absolute;inset-inline-end:16px;bottom:82px;width:56px;height:56px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(29,63,115,.35);font-size:30px;font-weight:600;line-height:1}

/* chips & lists */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.up{background:var(--navy-soft);color:var(--navy)} .chip.done{background:var(--good-soft);color:var(--good)}
.chip.cancel{background:var(--bad-soft);color:var(--bad)} .chip.past{background:var(--warn-soft);color:var(--warn)} .chip.none{background:var(--surface-2);color:var(--ink-3)}
.hero .chip.up{background:rgba(255,255,255,.18);color:#fff}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-align:start;width:100%}
.item:last-child{border-bottom:0} .item:hover{background:var(--surface-2)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:800;font-size:15px} .item .s{font-size:13px;color:var(--ink-2);margin-top:2px}
.item .chev{color:var(--ink-3)}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.bar-track{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar-fill{height:100%;background:var(--good);border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;font-weight:600}
.step i{width:26px;height:26px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;flex:none}
.step.done i{background:var(--good-soft);color:var(--good)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font-size:15px}
textarea.input{min-height:120px;resize:vertical;line-height:1.5}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.part{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:0}
.part .name{flex:1;font-weight:700}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px}
.stepper button{width:38px;height:36px;border-radius:9px;font-size:20px;font-weight:700;color:var(--navy)}
.stepper button:hover{background:var(--surface)}
.stepper b{width:52px;text-align:center;font-variant-numeric:tabular-nums}
.part .x{color:var(--ink-3);width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.att-row{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:0}
.att-row .n{font-weight:800;font-size:15px}
.att-row .seg button.on.p{background:var(--good);color:#fff} .att-row .seg button.on.a{background:var(--bad);color:#fff} .att-row .seg button.on.e{background:var(--warn);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--good)} .switch.on::after{transform:translateX(18px)} [dir="rtl"] .switch.on::after{transform:translateX(-18px)}

/* sheet / toast */
.sheet-wrap{position:absolute;inset:0;background:rgba(10,16,30,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px;animation:up .18s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
.sheet h3{margin:0;font-size:17px;font-weight:800}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;z-index:30;text-align:center;animation:up .15s ease-out}
@media (prefers-reduced-motion:reduce){.sheet,.toast{animation:none}}
.wa{background:#0b141a;color:#e9edef;border-radius:14px;padding:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.5;border:1px solid #1f2c34}
.wa .bubble{background:#005c4b;border-radius:10px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.pill-hint{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:700}
.sent-list{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
.sent-list .none{color:var(--ink-3);font-weight:600}
.wa-st{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;border-radius:8px;padding:2px 8px}
.wa-st.ok{background:var(--good-soft);color:var(--good)} .wa-st.no{background:var(--warn-soft);color:var(--warn)} .wa-st.warn{background:var(--bad-soft);color:var(--bad)}
.hero .wa-st.warn{background:rgba(255,140,120,.28);color:#FFD9D2}
.hero .wa-st.ok{background:rgba(255,255,255,.16);color:#fff} .hero .wa-st.no{background:rgba(255,205,120,.25);color:#FFE3A8}
</style>
</head>

const SEGN={en:{refereeing:"Refereeing",technique:"Technique",kata:"Kata",warmup:"Warm-up",randori:"Randori"},ar:{refereeing:"تحكيم",technique:"تكنيك",kata:"كاتا",warmup:"إحماء",randori:"راندوري"}};

/* ---------- sample data ---------- */
const iso=d=>d.toISOString().slice(0,10);
const today=new Date(); today.setHours(0,0,0,0);
const dPlus=n=>{const x=new Date(today);x.setDate(x.getDate()+n);return iso(x);};
const nextDow=(dow,from=1)=>{for(let i=from;i<15;i++){const x=new Date(today);x.setDate(x.getDate()+i);if(x.getDay()===dow)return iso(x);}return dPlus(1);};
const lastDow=(dow,from=1)=>{for(let i=from;i<15;i++){const x=new Date(today);x.setDate(x.getDate()-i);if(x.getDay()===dow)return iso(x);}return dPlus(-1);};
const PROG=[["refereeing",30],["technique",30],["kata",60]];
const id=()=>(crypto.randomUUID?crypto.randomUUID():"w"+Date.now().toString(36)+Math.random().toString(36).slice(2));
const S={
  ui:"en", msgLang:"both", tab:"home", view:{name:"home"}, toast:null, sheet:null,
  referees:[], sessions:[], attendance:{}, attMeta:{}, log:[], tomb:[],
  sync:{code:null,name:"",since:0,last:0,err:""}
};
/* ---------- persistence (this browser) ---------- */
const SAVE_KEYS=["ui","msgLang","referees","sessions","attendance","attMeta","log","tomb","sync"];
function save(){try{const o={};SAVE_KEYS.forEach(k=>o[k]=S[k]);localStorage.setItem("judoref",JSON.stringify(o));}catch(e){}}
(function load(){try{const o=JSON.parse(localStorage.getItem("judoref")||"null");if(o)SAVE_KEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k];});}catch(e){}
  const nav=(navigator.language||"en").toLowerCase();if(!localStorage.getItem("judoref")&&nav.startsWith("ar"))S.ui="ar";})();
const now=()=>Date.now();
const touch=o=>{o.updatedAt=now();o.dirty=1;return o;};
const setAtt=(sid,rid,v)=>{S.attendance[sid+"|"+rid]=v;S.attMeta[sid+"|"+rid]={updatedAt:now(),dirty:1};};

/* ---------- helpers ---------- */
const t=()=>T[S.ui]; const loc=()=>S.ui==="ar"?"ar-AE-u-nu-latn":"en-GB";
const fmtDate=d=>new Date(d+"T12:00").toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"});
const fmtShort=d=>new Date(d+"T12:00").toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short"});
const dayName=(d,l)=>new Date(d+"T12:00").toLocaleDateString(l||loc(),{weekday:"long"});
const fmtTime=hm=>{const[h,m]=hm.split(":").map(Number);const d=new Date();d.setHours(h,m);return d.toLocaleTimeString(loc(),{hour:"numeric",minute:"2-digit"});};
const addMin=(hm,n)=>{const[h,m]=hm.split(":").map(Number);const tt=((h*60+m+n)%1440+1440)%1440;return String(Math.floor(tt/60)).padStart(2,"0")+":"+String(tt%60).padStart(2,"0");};
const total=s=>s.segs.reduce((a,p)=>a+p[1],0)||120;
const range=s=>fmtTime(s.time)+" – "+fmtTime(addMin(s.time,total(s)));
const started=s=>new Date(s.date+"T"+s.time)<new Date();
const progLine=s=>s.segs.filter(p=>p[1]>0).map(p=>segName(p[0])+" "+p[1]+"′").join(" · ");
const segName=k=>k.startsWith("c:")?k.slice(2):SEGN[S.ui][k];
const isoToday=iso(today), isoTom=dPlus(1);
const sessionsOn=d=>S.sessions.filter(s=>s.date===d);
const nextSession=()=>S.sessions.filter(s=>s.status==="upcoming"&&s.date>=isoToday).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
const isClassDay=d=>{const dow=new Date(d+"T12:00").getDay();const from=dPlus(-35);return S.sessions.some(s=>s.status!=="cancelled"&&s.date>=from&&s.date<=isoToday&&new Date(s.date+"T12:00").getDay()===dow);};
const attOf=(sid,rid)=>S.attendance[sid+"|"+rid];
const monthPrefix=isoToday.slice(0,7);
const stats=(rid,month)=>{let p=0,c=0;S.sessions.filter(s=>s.status==="done"&&(!month||s.date.startsWith(month))).forEach(s=>{const v=attOf(s.id,rid);if(v==="present"){p++;c++;}else if(v==="absent")c++;});return[p,c];};
const pct=(p,c)=>c?Math.round(100*p/c):0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kindName=k=>({reminder:t().tReminder,change:t().tChange,cancel:t().tCancel,summary:t().msgSummary}[k]);
const lastLog=s=>S.log.filter(x=>x.sid===s.id).sort((a,b)=>b.at-a.at)[0];
/* what the group needs next: "reminder" | "change" | "cancel" | null */
const needs=s=>{const l=lastLog(s);if(s.status==="cancelled")return l&&l.kind!=="cancel"?"cancel":null;if(s.status==="done")return null;if(!l)return "reminder";if(l.kind==="cancel")return "change";/* restored after a sent cancellation: re-announce */ if((s.changedAt||0)>l.at)return "change";return null;};
const waStatus=s=>{const l=lastLog(s),n=needs(s),tt=t();
  if(n==="change")return `<span class="wa-st warn">⚠ ${tt.waChanged}</span>`;
  if(n==="cancel")return `<span class="wa-st no">✗ ${tt.waCancelNot}</span>`;
  if(n==="reminder")return `<span class="wa-st no">✗ ${tt.waNot}</span>`;
  if(l)return `<span class="wa-st ok">✓ ${tt.waSent(kindName(l.kind))}</span>`;
  return "";};
const fmtAt=ms=>new Date(ms).toLocaleString(loc(),{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});

/* ---------- messages (same templates as the app) ---------- */
const timeAr=hm=>{const[h,m]=hm.split(":").map(Number);return `${h%12||12}:${String(m).padStart(2,"0")} ${h<12?"صباحاً":"مساءً"}`;};
const timeEn=hm=>{const[h,m]=hm.split(":").map(Number);return `${h%12||12}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`;};
const dm=(d,l)=>new Date(d+"T12:00").toLocaleDateString(l,{day:"numeric",month:"long"});
function whenAr(s,withDate){const day=dayName(s.date,"ar-AE-u-nu-latn");const d=s.date===isoToday?"اليوم "+day:s.date===isoTom?"غداً "+day:"يوم "+day+(withDate?" "+dm(s.date,"ar-AE-u-nu-latn"):"");return d+" من الساعة "+timeAr(s.time)+" إلى "+timeAr(addMin(s.time,total(s)));}
function whenEn(s,withDate){const day=dayName(s.date,"en-GB");const d=s.date===isoToday?"today, "+day:s.date===isoTom?"tomorrow, "+day:"on "+day+(withDate?", "+dm(s.date,"en-GB"):"");return d+", from "+timeEn(s.time)+" to "+timeEn(addMin(s.time,total(s)));}
const progAr=s=>s.segs.some(p=>p[1]>0)?"برنامج التمرين:\n"+s.segs.filter(p=>p[1]>0).map(p=>`${p[1]} دقيقة: ${p[0].startsWith("c:")?p[0].slice(2):SEGN.ar[p[0]]}`).join("\n")+"\n":"";
const progEn=s=>s.segs.some(p=>p[1]>0)?"Training Program:\n"+s.segs.filter(p=>p[1]>0).map(p=>`${p[1]} minutes: ${p[0].startsWith("c:")?p[0].slice(2):SEGN.en[p[0]]}`).join("\n")+"\n":"";
function chain(s){const out=[s];let d=s.date;for(let i=0;i<6;i++){d=addDays(d,1);const up=sessionsOn(d).find(x=>x.status==="upcoming");if(!up)break;out.push(up);}return out;}
const addDays=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return iso(x);};
function buildMsg(kind,s,lang){
  if(kind==="summary")return summaryMsg(lang);
  const notes=s.notes.trim()?s.notes.trim()+"\n":"";let ar,en;
  if(kind==="reminder"){const b=chain(s);const wa=b.map((x,i)=>i?"، وكذلك "+whenAr(x,false):whenAr(x,true)).join("");const we=b.map((x,i)=>i?", and also "+whenEn(x,false):whenEn(x,true)).join("");
    ar=`السلام عليكم جميعاً،\nتذكير بموعد التمرين ${wa}.\n${progAr(s)}${notes}نرجو من الجميع الالتزام بالوقت، ونشوفكم على خير.`;
    en=`Dear all,\nThis is a reminder that our training session${b.length>1?"s":""} will be ${we}.\n${progEn(s)}${notes}Please make sure to arrive on time. See you all.`;}
  else if(kind==="change"){ar=`السلام عليكم جميعاً،\nنود إعلامكم بتغيير موعد التمرين. الموعد الجديد: ${whenAr(s,true)}.\n${progAr(s)}${notes}نرجو من الجميع الالتزام بالوقت، ونشوفكم على خير.`;
    en=`Dear all,\nPlease note that the training schedule has changed. The new time is ${whenEn(s,true)}.\n${progEn(s)}${notes}Please make sure to arrive on time. See you all.`;}
  else {ar=`السلام عليكم جميعاً،\nنود إعلامكم بأنه تم إلغاء تمرين ${whenAr(s,true)}.\n${notes}سنوافيكم بموعد التمرين القادم، وشكراً لتفهمكم.`;
    en=`Dear all,\nPlease note that the training session ${whenEn(s,true)} has been cancelled.\n${notes}We will let you know the date of the next session. Thank you for your understanding.`;}
  return lang==="ar"?ar:lang==="en"?en:ar+"\n\n"+en;
}
function summaryMsg(lang){const n=S.sessions.filter(s=>s.status==="done"&&s.date.startsWith(monthPrefix)).length;
  const lines=S.referees.map(r=>{const[p,c]=stats(r.id,monthPrefix);return `• ${r.name}: ${c?p+"/"+c:"—"}`;}).join("\n");
  const ar=`ملخص الحضور لهذا الشهر\nعدد التمارين: ${n}\n${lines}`,en=`Attendance summary for this month\nSessions held: ${n}\n${lines}`;return lang==="ar"?ar:lang==="en"?en:ar+"\n\n"+en;}

function homeView(){
  const tt=t();const next=nextSession();const noRefs=!S.referees.length,noSess=!S.sessions.length;
  let warn="";if(S.referees.length&&!S.brk){const late=sessionsOn(isoToday).filter(s=>s.status==="upcoming"&&started(s)&&!Object.keys(S.attendance).some(k=>k.startsWith(s.id+"|"))).sort((a,b)=>a.time.localeCompare(b.time))[0];
    if(late)warn=tt.warnAtt(fmtTime(late.time));else if(isClassDay(isoTom)&&!sessionsOn(isoTom).length)warn=tt.warnGap;}
  let hero,btns;
  if(!next){let sub="";const canc=S.sessions.filter(s=>s.status==="cancelled"&&s.date>=isoToday).sort((a,b)=>a.date.localeCompare(b.date))[0];let restore="";
    if(S.brk)sub=tt.breakOn;else if(canc){sub=tt.cancelledNext(dayName(canc.date));restore=`<button class="btn tonal" data-open="${canc.id}">${tt.restore(dayName(canc.date))}</button>`;}
    else if(!(noRefs||noSess)){let hit=null;for(let i=1;i<=7;i++){const d=dPlus(i);if(isClassDay(d)){hit=d;break;}}sub=hit?tt.hintDay(dayName(hit)):tt.hintNone;}
    hero=`<div class="hero"><div class="eyebrow">${tt.next}</div><div class="big">${tt.none}</div><div class="meta">${sub}</div></div>`;
    btns=`${restore}<button class="btn primary" data-go="new">${ICON.plus}${tt.schedule}</button>`;}
  else{const st=started(next);
    hero=`<div class="hero">${statusChip(next)}<div class="eyebrow">${tt.next}</div><div class="big">${fmtDate(next.date)}</div><div class="time">⏰ ${range(next)}</div><div class="meta">${progLine(next)}${next.notes?" · "+esc(next.notes):""}</div><div class="meta" style="margin-top:8px">${waStatus(next)}</div></div>`;
    const n=needs(next);btns=`<button class="btn ${st?"tonal":"primary"}" data-msg="${n==="change"?"change":"reminder"}" data-sid="${next.id}">${ICON.send}${n==="change"?tt.sendChange:tt.sendRem}</button>${next.date<=isoToday?`<button class="btn ${st?"primary":"tonal"}" data-att="${next.id}">${ICON.check}${tt.takeAtt}</button>`:""}`;}
  const held=S.sessions.filter(s=>s.status==="done"&&s.date.startsWith(monthPrefix)).length;let P=0,C=0;S.referees.forEach(r=>{const[p,c]=stats(r.id,monthPrefix);P+=p;C+=c;});
  const gs=(noRefs||noSess)?`<div class="card"><div class="eyebrow">${tt.getStarted}</div><div class="steps"><div class="step ${noRefs?"":"done"}"><i>${noRefs?"1":"✓"}</i><button data-tab="referees">${tt.gs1}</button></div><div class="step ${noSess?"":"done"}"><i>${noSess?"2":"✓"}</i><button data-go="new">${tt.gs2}</button></div></div></div>`:"";

  clearTimeout(render._t);render._t=setTimeout(()=>Sync.kick(),1500);
}
function openMsg(kind,sid){M={kind,sid,lang:S.msgLang,text:"",waStep:null};M.text=buildMsg(kind,S.sessions.find(x=>x.id===sid),M.lang);M.gen=M.text;go({name:"msg"});}
function startEdit(s){E=s?{id:s.id,date:s.date,time:s.time,notes:s.notes,status:s.status,segs:s.segs.map(p=>[...p]),orig:JSON.stringify([s.date,s.time,s.segs])}
  :(()=>{const last=[...S.sessions].filter(x=>x.status!=="cancelled").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).find(x=>x.date<=isoToday)||[...S.sessions].filter(x=>x.status!=="cancelled").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0];
    let date=null;for(let i=1;i<=14;i++){const d=dPlus(i);if(isClassDay(d)&&!sessionsOn(d).length){date=d;break;}}
    return {id:null,date:date||isoTom,time:last?last.time:"09:00",notes:"",status:"upcoming",segs:last?last.segs.map(p=>[...p]):PROG.map(p=>[...p]),orig:null};})();
  go({name:"edit"});}
function saveEdit(send){const e=E;e.date=document.getElementById("f-date").value||e.date;e.time=document.getElementById("f-time").value||e.time;e.notes=document.getElementById("f-notes").value;
  const tt=t();let s;const isNew=!e.id;const whenChanged=!isNew&&JSON.stringify([e.date,e.time])!==JSON.stringify(JSON.parse(e.orig).slice(0,2));const changed=!isNew&&JSON.stringify([e.date,e.time,e.segs])!==e.orig;
  let restored=false;if(e.status==="cancelled"&&whenChanged){e.status="upcoming";restored=true;}
  if(isNew){s=touch({id:id(),date:e.date,time:e.time,notes:e.notes,status:"upcoming",segs:e.segs,changedAt:0});S.sessions.push(s);}else{s=S.sessions.find(x=>x.id===e.id);Object.assign(s,{date:e.date,time:e.time,notes:e.notes,status:e.status,segs:e.segs});if(changed)s.changedAt=Date.now();touch(s);}
  stack.pop();S.view={name:"session",id:s.id};render();toast(restored?tt.trainingRestoredMsg:tt.saved);
  if(!send)return;
  const n=needs(s);            // the app decides: reminder / change / cancel
  openMsg(n||"reminder",s.id);}

document.getElementById("app").addEventListener("click",ev=>{
  if(ev.target.classList&&ev.target.classList.contains("sheet-wrap")){closeSheet();return;} /* tap on the dim backdrop closes the sheet */
  const el=ev.target.closest("[data-tab],[data-go],[data-open],[data-msg],[data-att],[data-ref],[data-add-ref],[data-restore],[data-edit],[data-cancel],[data-del],[data-marksent],[data-dellog],[data-step],[data-rmpart],[data-addpart],[data-save],[data-mark],[data-allpresent],[data-finish],[data-editref],[data-rmref],[data-kind],[data-lang],[data-openwa],[data-copymsg],[data-sync],[data-pin],[data-brk],[data-msglang],[data-uilang],[data-toast],[data-act]");
  if(!el)return;const d=el.dataset,tt=t();
  if(d.act!==undefined){const a=d.act;const s=S.sheet;S.sheet=null;if(a!=="close"&&s&&s.actions&&s.actions[a])s.actions[a]();else render();return;}
  if(d.tab){S.tab=d.tab;stack.length=0;S.view={name:d.tab};render();return;}
  if(d.go==="back")return back();if(d.go==="new")return startEdit(null);if(d.go==="settings")return go({name:"settings"});
  if(d.open)return go({name:"session",id:d.open});
  if(d.msg)return openMsg(d.msg,d.sid||(nextSession()||{}).id);
  if(d.att)return go({name:"att",id:d.att});
  if(d.ref)return go({name:"ref",id:d.ref});
  if(d.addRef!==undefined||d.editref){const r=d.editref?S.referees.find(x=>x.id===d.editref):null;
    sheet(`<h3>${r?tt.edit:tt.addRef}</h3><div class="field"><label>${tt.name}</label><input class="input" id="f-name" value="${r?esc(r.name):""}"></div><div class="row-btns"><button class="btn ghost sm" data-act="close">${tt.cancel}</button><button class="btn primary sm" data-act="ok">${tt.saved.replace("تم الحفظ","حفظ").replace("Saved","Save")}</button></div>`,
      {ok:()=>{const n=document.getElementById("f-name").value.trim();if(!n)return render();if(r){r.name=n;touch(r);}else S.referees.push(touch({id:id(),name:n}));render();toast(tt.saved);}});
    setTimeout(()=>document.getElementById("f-name")?.focus(),50);return;}
  if(d.restore){const x=S.sessions.find(y=>y.id===d.restore);x.status="upcoming";touch(x);render();toast(tt.restored);return;}
  if(d.edit)return startEdit(S.sessions.find(x=>x.id===d.edit));
  if(d.cancel){const s=S.sessions.find(x=>x.id===d.cancel);confirmSheet(tt.confirmCancel,tt.cancelT,()=>{s.status="cancelled";touch(s);render();if(needs(s)==="cancel")openMsg("cancel",s.id);else toast(tt.waNever);},{danger:true});return;}
  if(d.del){confirmSheet(tt.confirmDel,tt.del,()=>{const x=S.sessions.find(y=>y.id===d.del);S.sessions=S.sessions.filter(y=>y.id!==d.del);S.tomb.push({t:"sessions",row:touch({...x,deletedAt:now()})});back();},{danger:true});return;}
  if(d.marksent){sheet(`<h3>${tt.markSent}</h3>${[["reminder",tt.tReminder],["change",tt.tChange],["cancel",tt.tCancel]].map(([k,l])=>`<button class="btn tonal sm" data-act="${k}">${l}</button>`).join("")}`,
    {reminder:()=>{S.log.push(touch({id:id(),sid:d.marksent,kind:"reminder",at:Date.now()}));render();},change:()=>{S.log.push(touch({id:id(),sid:d.marksent,kind:"change",at:Date.now()}));render();},cancel:()=>{S.log.push(touch({id:id(),sid:d.marksent,kind:"cancel",at:Date.now()}));render();}});return;}
  if(d.dellog){confirmSheet(tt.removeWhich,tt.remove,()=>{const x=S.log.find(l=>l.id===d.dellog);S.log=S.log.filter(l=>l.id!==d.dellog);S.tomb.push({t:"messagelog",row:touch({...x,deletedAt:now()})});render();},{danger:true});return;}
  if(d.step){const[i,n]=d.step.split("|");E.segs[+i][1]=Math.max(0,Math.min(300,E.segs[+i][1]+ +n));syncEdit();render();return;}
  if(d.rmpart){E.segs.splice(+d.rmpart,1);syncEdit();render();return;}
  if(d.addpart!==undefined){syncEdit();sheet(`<h3>${tt.addPart}</h3>${["refereeing","technique","kata","warmup","randori"].map(k=>`<button class="btn tonal sm" data-act="${k}">${SEGN[S.ui][k]}</button>`).join("")}<div class="field"><label>${tt.partName}</label><input class="input" id="f-part" placeholder="${tt.custom}"></div><button class="btn primary sm" data-act="custom">${tt.addPart}</button>`,
    Object.assign({custom:()=>{const n=(document.getElementById("f-part").value||"").replace(/[:;]/g," ").trim();if(n)E.segs.push(["c:"+n,30]);render();}},Object.fromEntries(["refereeing","technique","kata","warmup","randori"].map(k=>[k,()=>{E.segs.push([k,30]);render();}]))));return;}
  if(d.save)return saveEdit(d.save==="send");
  if(d.mark){const[r,v]=d.mark.split("|");setAtt(S.view.id,r,v);render();return;}
  if(d.allpresent!==undefined){S.referees.forEach(r=>setAtt(S.view.id,r.id,"present"));render();return;}
  if(d.finish){const s=S.sessions.find(x=>x.id===d.finish);if(s.status!=="cancelled"){s.status="done";touch(s);}back();Sync.kick();return;}
  if(d.rmref){const r=S.referees.find(x=>x.id===d.rmref);confirmSheet(tt.confirmRemove(r.name),tt.remove,()=>{S.referees=S.referees.filter(x=>x.id!==r.id);S.tomb.push({t:"referees",row:touch({...r,deletedAt:now()})});back();},{danger:true});return;}
  if(d.kind||d.lang){const cur=document.getElementById("f-msg").value;const apply=()=>{if(d.kind)M.kind=d.kind;if(d.lang)M.lang=d.lang;M.text=buildMsg(M.kind,S.sessions.find(x=>x.id===M.sid),M.lang);M.gen=M.text;render();};
    if(cur!==M.gen){M.text=cur;sheet(`<h3>${tt.replaceEdits}</h3><div class="row-btns"><button class="btn ghost sm" data-act="close">${tt.cancel}</button><button class="btn primary sm" data-act="ok">${tt.replace}</button></div>`,{ok:apply});}else apply();return;}
  if(d.openwa!==undefined){M.text=document.getElementById("f-msg").value;
    const askSent=()=>sheet(`<h3>${tt.didSend}</h3><div class="row-btns"><button class="btn ghost sm" data-act="close">${tt.notYet}</button><button class="btn primary sm" data-act="ok">${tt.yesSent}</button></div>`,{ok:()=>{S.log.push(touch({id:id(),sid:M.sid||null,kind:M.kind,at:Date.now()}));back();toast("✓ "+tt.yesSent);Sync.kick();}});
    if(navigator.share&&/Android|iPhone|iPad/i.test(navigator.userAgent)){navigator.share({text:M.text}).then(askSent).catch(()=>{});}
    else{window.open("https://wa.me/?text="+encodeURIComponent(M.text),"_blank");askSent();}
    return;}
  if(d.copymsg!==undefined){M.text=document.getElementById("f-msg").value;navigator.clipboard&&navigator.clipboard.writeText(M.text).then(()=>toast(tt.copied),()=>{});return;}
  if(d.pin!==undefined){const tt=t();const c=(document.getElementById("f-pin").value||"").trim().toUpperCase();if(!c)return;toast(tt.syncing);
    Sync.join(c).then(()=>{save();stack.length=0;S.view={name:"home"};render();toast(tt.synced);}).catch(e=>toast(Sync.friendly(e)));return;}
  if(d.sync){const tt=t();
    if(d.sync==="now"){toast(tt.syncing);Sync.kick((ok,m)=>toast(ok?tt.synced:m));return;}
    if(d.sync==="share"){const text=tt.shareText(S.sync.name||"JudoRef",S.sync.code,Sync.WEB);if(navigator.share)navigator.share({text}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");return;}
    if(d.sync==="leave"){confirmSheet(tt.leaveConfirm,tt.leave,()=>{Sync.leave();S.referees=[];S.sessions=[];S.attendance={};S.attMeta={};S.log=[];S.tomb=[];stack.length=0;S.view={name:"home"};render();},{danger:true});return;}
    if(d.sync==="export"){const o={app:"JudoRef",version:4,web:true,exportedAt:Date.now(),data:{referees:S.referees,sessions:S.sessions,attendance:S.attendance,log:S.log}};const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(o,null,2));a.download="judoref-backup-"+isoToday+".json";a.click();return;}
    if(d.sync==="create"){sheet(`<h3>${tt.createClass}</h3><div class="field"><label>${tt.className}</label><input class="input" id="f-cls" value="JudoRef"></div><div class="row-btns"><button class="btn ghost sm" data-act="close">${tt.cancel}</button><button class="btn primary sm" data-act="ok">${tt.createClass}</button></div>`,
      {ok:()=>{const n=document.getElementById("f-cls").value.trim()||"JudoRef";toast(tt.syncing);Sync.create(n).then(()=>{save();render();toast(tt.created);}).catch(e=>toast(Sync.friendly(e)));}});setTimeout(()=>document.getElementById("f-cls")?.focus(),50);return;}
    if(d.sync==="join"){sheet(`<h3>${tt.joinClass}</h3><div class="tiny">${tt.joinWarn}</div><div class="field"><label>${tt.classCode}</label><input class="input" id="f-code" maxlength="6" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.12em;font-weight:800"></div><div class="row-btns"><button class="btn ghost sm" data-act="close">${tt.cancel}</button><button class="btn primary sm" data-act="ok">${tt.joinClass}</button></div>`,
      {ok:()=>{const c=document.getElementById("f-code").value.trim().toUpperCase();if(c.length!==6)return toast(tt.badCode);toast(tt.syncing);Sync.join(c).then(()=>{save();stack.length=0;S.view={name:"home"};render();toast(tt.joined);}).catch(e=>toast(Sync.friendly(e)));}});setTimeout(()=>document.getElementById("f-code")?.focus(),50);return;}
  }
  if(d.msglang){S.msgLang=d.msglang;render();return;}
  if(d.uilang){S.ui=d.uilang;render();return;}
  if(d.toast){toast(d.toast);return;}
});
document.getElementById("app").addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="f-pin"){ev.preventDefault();document.querySelector("[data-pin]").click();}});
document.getElementById("app").addEventListener("change",ev=>{const el=ev.target;if(el.id==="f-rem"){S.reminder=el.value;toast(t().saved);}if(el.id==="f-date"||el.id==="f-time"){syncEdit();render();}});
function syncEdit(){if(!E)return;const d=document.getElementById("f-date"),tm=document.getElementById("f-time"),n=document.getElementById("f-notes");if(d)E.date=d.value||E.date;if(tm)E.time=tm.value||E.time;if(n)E.notes=n.value;}
render();Sync.kick();
</script>
